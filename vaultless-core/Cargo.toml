[package]
name = "vaultless-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
atomic = "0.6.1"
base64 = "0.22.1"
bcrypt = "0.17.1"
bigdecimal = { version = "0.4.9", features = ["serde"] }
bincode = { version = "2.0.1", features = ["alloc", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
ciborium = { version = "0.2.2", optional = true }
deadpool-redis = "0.22.0"
ed25519 = "2.2.3"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }
futures = "0.3.31"
futures-util = "0.3.31"
getrandom = "0.3.3"
hex = "0.4.3"
hmac = "0.12.1"
ipnetwork = "0.21.1"
jsonwebtoken = { version = "10.2", features = ["aws_lc_rs"] }
lazy_static = "1.5.0"
moka = { version = "0.12.11", features = ["future"] }
once_cell = "1.21.3"
paseto = "2.0.2"
pasetors = "0.7.7"
prometheus = { version = "0.14.0", features = ["process"] }
rand = "0.9.2"
redis = { version = "0.32.7", features = ["aio", "connection-manager"] }
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }
ring = "0.17.14"
ring-compat = "0.8.0"
rust_decimal = "1.39.0"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate", "ipnetwork", "macros", "bigdecimal", "uuid", "chrono", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = "0.1.17"
tokio-test = "0.4.4"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
webpki = "0.22.4"
x509-parser = { version = "0.18.0", optional = true }
zeroize = "1.8.2"

[features]
default = ["cbor", "x509"] 
cbor = ["ciborium"]
x509 = ["x509-parser"]
