name: Vaultless CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: 🦀 Build & Test (All Crates)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: vaultless_test
        # Add these options to make sure Postgres is actually ready
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER} -d vaultless_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 🧰 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: 🕐 Wait for Postgres to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U ${{ secrets.POSTGRES_USER }}; then
              echo "✅ Postgres is ready!"
              break
            fi
            echo "⏳ Waiting for Postgres..."
            sleep 3
          done

      - name: 🔧 Build all crates
        run: cargo build --workspace --verbose

      - name: 🧪 Run all tests
        env:
          DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/vaultless_test
        run: cargo test --workspace --verbose

      - name: 🧹 Clippy (Lint)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 📏 Format check
        run: cargo fmt --all -- --check
