version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultless-postgres
    environment:
      POSTGRES_USER: vaultless
      POSTGRES_PASSWORD: vaultless_dev_pass
      POSTGRES_DB: vaultless_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultless"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
