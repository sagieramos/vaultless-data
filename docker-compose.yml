services:
  postgres:
    image: timescale/timescaledb:2.15.2-pg16 # postgres:16-alpine
    container_name: vaultless-postgres
    environment:
      POSTGRES_USER: vaultless
      POSTGRES_PASSWORD: vaultless_dev_pass
      POSTGRES_DB: vaultless_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultless"]
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: vaultless-dragonfly
    ports:
      - "6379:6379"
    command: >
      --bind 0.0.0.0
      --logtostderr
      --dir /data
      --maxmemory 512mb
      --proactor_threads 2
    volumes:
      - dragonfly_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dragonfly_data: