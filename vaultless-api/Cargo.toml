[package]
name = "vaultless-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
asn1-rs = "0.7.1"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["macros", "ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
config = "0.15.18"
deadpool-redis = "0.22.0"
dotenvy = "0.15.7"
futures = "0.3.31"
hyper = { version = "1.7.0", features = ["full"] }
lettre = { version = "0.11.19", features = ["tokio1", "tokio1-native-tls", "smtp-transport"] }
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
moka = "0.12.11"
once_cell = "1.21.3"
prometheus = "0.14.0"
redis = { version = "0.32.7", features = ["tokio-comp"] }
regex = "1.12.2"
rust_decimal = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
tera = "1.20.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.16"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace", "compression-gzip"] }
tower_governor = "0.8.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
vaultless-core = { version = "0.1.0", path = "../vaultless-core" }

[dev-dependencies]
tokio-test = "0.4.4"
