[package]
name = "vaultless-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# =============================================================================
# CORE DEPENDENCY
# =============================================================================
vaultless-core = { version = "0.1.0", path = "../vaultless-core" }

# =============================================================================
# SHARED CRATES (same versions as vaultless-core for consistency)
# =============================================================================
# These crates are used directly in vaultless-api code and need to be
# direct dependencies for macro expansion and direct module access.

# Serialization (needed for derive macros)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation (needed for derive macro)
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror = "2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging/tracing (needed for macros like tracing::info!)
tracing = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1.11", features = ["v4", "serde"] }

# Redis (for direct use in handlers) - MUST match vaultless-core versions
redis = { version = "0.32.7", features = ["aio", "connection-manager"] }
deadpool-redis = "0.22.0"

# Database - MUST match vaultless-core version
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Metrics - MUST match vaultless-core version
prometheus = { version = "0.14.0", features = ["process"] }

# Concurrency utilities
once_cell = "1.19"
futures = "0.3"

# Regex
regex = "1.10"

# =============================================================================
# API-SPECIFIC DEPENDENCIES
# =============================================================================

# Error handling (keep for convenience, same version as core)
anyhow = "1.0.100"

# ASN.1 parsing (API-specific)
asn1-rs = "0.7.1"

# Async traits (keep for derive macro)
async-trait = "0.1.89"

# Web framework
axum = { version = "0.8.6", features = ["macros", "ws"] }

# Base64 encoding (keep for convenience)
base64 = "0.22.1"

# Configuration loading
config = "0.15.18"

# Concurrent hash maps
dashmap = "6.1.0"

# Environment variable loading
dotenvy = "0.15.7"

# HTTP client/server
hyper = { version = "1.7.0", features = ["full"] }

# Email sending
lettre = { version = "0.11.19", features = ["tokio1", "tokio1-native-tls", "smtp-transport"] }

# Metrics facade
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"

# Tunneling for development
ngrok = { version = "0.17.0", features = ["axum"] }

# Decimal numbers (keep for convenience)
rust_decimal = "1.39.0"

# Templating engine
tera = "1.20.0"

# Tokio utilities
tokio-util = "0.7.16"

# Tower middleware
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace", "compression-gzip"] }
tower_governor = "0.8.0"

# Logging subscriber (API-specific config)
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# OpenAPI documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
tokio-test = "0.4.4"
