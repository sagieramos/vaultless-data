[package]
name = "vaultless-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
deadpool-redis = "0.22.0"
lettre = { version = "0.11.19", features = ["tokio1", "smtp-transport", "builder"] }
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
redis = "0.32.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
vaultless-core = { path = "../vaultless-core" }
